te> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg> </a><a href="https://twitter.com/zdyxry" target="_blank" rel="noopener" aria-label="Twitter" data-astro-cid-sz7xmlte> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"></path></svg> </a><a href="https://neodb.social/users/zdyxry/" target="_blank" rel="noopener" aria-label="NeoDB" data-astro-cid-sz7xmlte> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> </a><a href="https://www.strava.com/athletes/160667061" target="_blank" rel="noopener" aria-label="Strava" data-astro-cid-sz7xmlte> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17.5L11 9H8l7 14 7-14h-3l-2 4.5z"></path><path d="M10.5 7.5L7 1l-5 10h3l2.5-4.5z"></path></svg> </a><a href="/atom.xml" aria-label="RSS" data-astro-cid-sz7xmlte> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg> </a> </div> <p class="copyright" data-astro-cid-sz7xmlte>&copy; 2026 Yiran's Blog · Powered by <a href="https://astro.build" target="_blank" rel="noopener" data-astro-cid-sz7xmlte>Astro</a></p> </div> </footer> </body></html> <script>
  window.addEventListener('DOMContentLoaded', async () => {
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('search-results');
    
    let pagefind;
    
    try {
      // 初始化 pagefind
      pagefind = await import('/pagefind/pagefind.js');
      await pagefind.init();
      
      // 启用输入框
      searchInput.placeholder = '搜索文章标题、内容...';
      searchInput.disabled = false;
    } catch (error) {
      console.error('Failed to load Pagefind:', error);
      resultsContainer.innerHTML = '<p class="error">搜索功能加载失败，请刷新页面重试</p>';
      return;
    }
    
    const PAGE_SIZE = 20;
    let currentResults = [];
    let displayedCount = 0;

    async function loadMore() {
      const list = resultsContainer.querySelector('.results-list');
      const end = Math.min(displayedCount + PAGE_SIZE, currentResults.length);

      for (let i = displayedCount; i < end; i++) {
        const data = await currentResults[i].data();
        const li = document.createElement('li');
        li.className = 'result-item';
        li.innerHTML = '<a href="' + data.url + '" class="result-title">' + (data.meta.title || '无标题') + '</a>'
          + '<p class="result-excerpt">' + data.excerpt + '</p>';
        list.appendChild(li);
      }

      displayedCount = end;

      const oldBtn = resultsContainer.querySelector('.load-more-btn');
      if (oldBtn) oldBtn.remove();

      if (displayedCount < currentResults.length) {
        const btn = document.createElement('button');
        btn.className = 'load-more-btn';
        btn.textContent = '查看更多（剩余 ' + (currentResults.length - displayedCount) + ' 个结果）';
        btn.addEventListener('click', loadMore);
        resultsContainer.appendChild(btn);
      }
    }

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        resultsContainer.innerHTML = '';
        return;
      }
      
      resultsContainer.innerHTML = '<p class="loading">搜索中...</p>';
      
      try {
        const search = await pagefind.search(query);
        
        if (search.results.length === 0) {
          resultsContainer.innerHTML = '<p class="no-results">未找到「' + query + '」的相关结果</p>';
          return;
        }

        currentResults = search.results;
        displayedCount = 0;
        
        resultsContainer.innerHTML = '<p class="result-count">找到 ' + search.results.length + ' 个结果</p>'
          + '<ul class="results-list"></ul>';

        await loadMore();
      } catch (error) {
        console.error('Search error:', error);
        resultsContainer.innerHTML = '<p class="error">搜索出错，请重试</p>';
      }
    }
    
    searchButton.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  });
</script>
