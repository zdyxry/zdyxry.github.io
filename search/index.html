r" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg></a></div><p class="copyright" data-astro-cid-jo6i4kqk>&copy; 2026 Yiran's Blog · Powered by <a href="https://astro.build" target="_blank" rel="noopener" data-astro-cid-jo6i4kqk>Astro</a></p></div></footer></body></html><script>
  window.addEventListener('DOMContentLoaded', async () => {
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('search-results');
    
    let pagefind;
    
    try {
      // 初始化 pagefind
      pagefind = await import('/pagefind/pagefind.js');
      await pagefind.init();
      
      // 启用输入框
      searchInput.placeholder = '搜索文章标题、内容...';
      searchInput.disabled = false;
    } catch (error) {
      console.error('Failed to load Pagefind:', error);
      resultsContainer.innerHTML = '<p class="error">搜索功能加载失败，请刷新页面重试</p>';
      return;
    }
    
    const PAGE_SIZE = 20;
    let currentResults = [];
    let displayedCount = 0;

    async function loadMore() {
      const list = resultsContainer.querySelector('.results-list');
      const end = Math.min(displayedCount + PAGE_SIZE, currentResults.length);

      for (let i = displayedCount; i < end; i++) {
        const data = await currentResults[i].data();
        const li = document.createElement('li');
        li.className = 'result-item';
        li.innerHTML = '<a href="' + data.url + '" class="result-title">' + (data.meta.title || '无标题') + '</a>'
          + '<p class="result-excerpt">' + data.excerpt + '</p>';
        list.appendChild(li);
      }

      displayedCount = end;

      const oldBtn = resultsContainer.querySelector('.load-more-btn');
      if (oldBtn) oldBtn.remove();

      if (displayedCount < currentResults.length) {
        const btn = document.createElement('button');
        btn.className = 'load-more-btn';
        btn.textContent = '查看更多（剩余 ' + (currentResults.length - displayedCount) + ' 个结果）';
        btn.addEventListener('click', loadMore);
        resultsContainer.appendChild(btn);
      }
    }

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        resultsContainer.innerHTML = '';
        return;
      }
      
      resultsContainer.innerHTML = '<p class="loading">搜索中...</p>';
      
      try {
        const search = await pagefind.search(query);
        
        if (search.results.length === 0) {
          resultsContainer.innerHTML = '<p class="no-results">未找到「' + query + '」的相关结果</p>';
          return;
        }

        currentResults = search.results;
        displayedCount = 0;
        
        resultsContainer.innerHTML = '<p class="result-count">找到 ' + search.results.length + ' 个结果</p>'
          + '<ul class="results-list"></ul>';

        await loadMore();
      } catch (error) {
        console.error('Search error:', error);
        resultsContainer.innerHTML = '<p class="error">搜索出错，请重试</p>';
      }
    }
    
    searchButton.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  });
</script>
