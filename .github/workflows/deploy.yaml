name: GitHub Pages

on:
  push:
    branches:
      - astro  # Astro 作为默认分支
  pull_request:
  schedule:
    # 每天 00:10 UTC（北京时间 08:10）自动运行
    - cron: '10 0 * * *'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch COROS running data (uv)
        id: coros
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          MAX_HR: ${{ secrets.MAX_HR || '190' }}
          RESTING_HR: ${{ secrets.RESTING_HR || '55' }}
        run: |
          uv run scripts/get_coros_data.py --days 30

      - name: Fetch Garmin running data (fallback, uv)
        if: ${{ steps.coros.outcome == 'failure' }}
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          MAX_HR: ${{ secrets.MAX_HR || '190' }}
          RESTING_HR: ${{ secrets.RESTING_HR || '55' }}
        run: |
          uv run scripts/get_garmin_data.py --days 30

      - name: Recalculate VDOT and training load for all records
        env:
          MAX_HR: ${{ secrets.MAX_HR || '190' }}
          RESTING_HR: ${{ secrets.RESTING_HR || '55' }}
        run: |
          # 重新计算所有历史数据的 VDOT 和训练负荷
          # 这确保当 MAX_HR/RESTING_HR 调整时，所有数据都会更新
          python3 scripts/calculate_vdot_for_existing.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/astro' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
