name: GitHub Pages

on:
  push:
    branches:
      - hugo  # Set a branch to deploy
  pull_request:
  schedule:
    # 每天 00:10 UTC（北京时间 08:10）自动运行
    - cron: '10 0 * * *'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod


      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch Garmin running data (uv)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          uv run scripts/get_garmin_data.py --days 7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/hugo' }}
        with:
          #  Note that the GITHUB_TOKEN is NOT a personal access token. A GitHub Actions runner automatically creates a
          #  GITHUB_TOKEN secret to authenticate in your workflow. So, you can start to deploy immediately without any
          #  configuration.
          # 不用管这个 secret，github action 会自动创建
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
